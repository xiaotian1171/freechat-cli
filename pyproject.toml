[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freechat-cli"
version = "1.1.0"
description = "Zero-config AI chat in your terminal — powered by free APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "xiaotian1171" },
]
keywords = ["chat", "ai", "cli", "pollinations", "openai", "free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
freechat = "freechat_cli.cli:main"

[project.urls]
Homepage = "https://github.com/xiaotian1171/freechat-cli"
Repository = "https://github.com/xiaotian1171/freechat-cli"
Issues = "https://github.com/xiaotian1171/freechat-cli/issues"

[tool.setuptools.packages.find]
include = ["freechat_cli*"]

[tool.ruff]
line-length = 100
target-version = "py38"
