[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freechat-cli"
version = "1.2.1"
description = "Zero-config AI chat in your terminal — powered by free APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "xiaotian1171" },
]
keywords = ["chat", "ai", "cli", "pollinations", "openai", "free", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8.0"]
token-accuracy = ["tiktoken>=0.5.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
freechat = "freechat_cli.cli:main"

[project.urls]
Homepage = "https://github.com/xiaotian1171/freechat-cli"
Repository = "https://github.com/xiaotian1171/freechat-cli"
Issues = "https://github.com/xiaotian1171/freechat-cli/issues"
Changelog = "https://github.com/xiaotian1171/freechat-cli/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["freechat_cli*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
